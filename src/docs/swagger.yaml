# Documentación de esta camada. Reemplazar los IDs de ejemplo por IDs de tu base.
# Las tiendas conservan actualmente respuestas distintas de usuarios y pedidos.
# Los schemas describen el comportamiento real; no agregan validaciones al backend.

tags:
  - name: Orders
    description: Gestión de pedidos
  - name: Users
    description: Gestión de usuarios
  - name: Stores
    description: Gestión de tiendas
  - name: Mocks
    description: Generación de datos ficticios en memoria o MongoDB
  - name: Support
    description: Health y prueba del logger
paths:
  /api/orders:
    get:
      tags: [Orders]
      summary: Listar pedidos
      description: Devuelve los pedidos con su cliente y tienda pobladas.
      responses:
        "200":
          description: Lista de ordenes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersResponse"
              example:
                status: success
                message: Lista de ordenes
                payload:
                  - _id: 6acf7ff968b188fed334690d
                    customer:
                      _id: 6acf7ff968b188fed334690c
                      firstName: Ana
                      lastName: Gomez
                      email: ana@example.com
                      password: clave-de-prueba
                      role: customer
                      documents: []
                    store:
                      _id: 6acf7ff968b188fed334690b
                      name: Tienda Centro
                      address: Av. Siempre Viva 100
                      owner: 6acf7ff968b188fed334690a
                      isActive: true
                    items:
                      - name: Caja mediana
                        quantity: 2
                        price: 1500
                    deliveryAddress: Calle falsa 123
                    total: 3000
                    status: created
                    priority: normal
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
    post:
      tags: [Orders]
      summary: Crear un pedido
      description: >-
        Requiere un usuario y una tienda existentes e items no vacíos. El servidor calcula total y
        fija status en created. Reemplazar los IDs de ejemplo por IDs de tu base.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
            example:
              customer: 6acf7ff968b188fed334690c
              store: 6acf7ff968b188fed334690b
              deliveryAddress: Calle falsa 123
              items:
                - name: Caja mediana
                  quantity: 2
                  price: 1500
              priority: normal
      responses:
        "201":
          description: Orden creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
              example:
                status: success
                message: Orden creada
                payload:
                  _id: 6acf7ff968b188fed334690d
                  customer: 6acf7ff968b188fed334690c
                  store: 6acf7ff968b188fed334690b
                  items:
                    - name: Caja mediana
                      quantity: 2
                      price: 1500
                  deliveryAddress: Calle falsa 123
                  total: 3000
                  status: created
                  priority: normal
        "400":
          description: >-
            Faltan datos obligatorios, items no es un array o está vacío, o un ID tiene formato
            inválido. Un ID inválido devuelve INVALID_ID_MONGOOSE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Faltan datos obligatorios
                code: VALIDATION_ERROR
        "404":
          description: Cliente o tienda no encontrados. También puede devolver STORE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Usuario no encontrado
                code: USER_NOT_FOUND
        "500":
          description: Error interno o validación de Mongoose no normalizada, como una prioridad desconocida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
  /api/orders/{oid}:
    parameters:
      - in: path
        name: oid
        required: true
        description: ID de un pedido existente. Reemplazar por un ID de tu base.
        schema:
          type: string
        example: 6acf7ff968b188fed334690d
    get:
      tags: [Orders]
      summary: Obtener un pedido por ID
      responses:
        "200":
          description: Orden obtenida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderReadResponse"
              example:
                status: success
                message: Orden obtenida
                payload:
                  _id: 6acf7ff968b188fed334690d
                  customer:
                    _id: 6acf7ff968b188fed334690c
                    firstName: Ana
                    lastName: Gomez
                    email: ana@example.com
                    password: clave-de-prueba
                    role: customer
                    documents: []
                  store:
                    _id: 6acf7ff968b188fed334690b
                    name: Tienda Centro
                    address: Av. Siempre Viva 100
                    owner: 6acf7ff968b188fed334690a
                    isActive: true
                  items:
                    - name: Caja mediana
                      quantity: 2
                      price: 1500
                  deliveryAddress: Calle falsa 123
                  total: 3000
                  status: created
                  priority: normal
        "400":
          description: El ID no tiene el formato correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: ID invalido
                code: INVALID_ID_MONGOOSE
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Pedido no encontrado
                code: ORDER_NOT_FOUND
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
    delete:
      tags: [Orders]
      summary: Eliminar un pedido
      description: Elimina el pedido y devuelve el documento eliminado, con sus relaciones como IDs.
      responses:
        "200":
          description: Orden eliminada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
              example:
                status: success
                message: Orden eliminada
                payload:
                  _id: 6acf7ff968b188fed334690d
                  customer: 6acf7ff968b188fed334690c
                  store: 6acf7ff968b188fed334690b
                  items:
                    - name: Caja mediana
                      quantity: 2
                      price: 1500
                  deliveryAddress: Calle falsa 123
                  total: 3000
                  status: created
                  priority: normal
        "400":
          description: El ID no tiene el formato correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: ID invalido
                code: INVALID_ID_MONGOOSE
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Pedido no encontrado
                code: ORDER_NOT_FOUND
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
  /api/orders/{oid}/status:
    parameters:
      - in: path
        name: oid
        required: true
        description: ID del pedido a actualizar.
        schema:
          type: string
        example: 6acf7ff968b188fed334690d
    put:
      tags: [Orders]
      summary: Actualizar el estado del pedido
      description: Valida que el estado exista. El proyecto no impone una secuencia de transiciones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusInput"
            example:
              status: assigned
      responses:
        "200":
          description: Orden actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
              example:
                status: success
                message: Orden actualizada
                payload:
                  _id: 6acf7ff968b188fed334690d
                  customer: 6acf7ff968b188fed334690c
                  store: 6acf7ff968b188fed334690b
                  items:
                    - name: Caja mediana
                      quantity: 2
                      price: 1500
                  deliveryAddress: Calle falsa 123
                  total: 3000
                  status: assigned
                  priority: normal
        "400":
          description: Estado no admitido o ID mal formado. El ID inválido devuelve INVALID_ID_MONGOOSE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Estado de pedido invalido
                code: INVALID_ORDER_STATUS
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Pedido no encontrado
                code: ORDER_NOT_FOUND
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
  /api/users:
    get:
      tags: [Users]
      summary: Listar usuarios
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersResponse"
              example:
                status: success
                message: Lista de usuarios
                payload:
                  - _id: 6acf7ff968b188fed334690c
                    firstName: Ana
                    lastName: Gomez
                    email: ana@example.com
                    password: clave-de-prueba
                    role: customer
                    documents: []
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
    post:
      tags: [Users]
      summary: Crear un usuario
      description: >-
        role es opcional y vale customer por defecto. En esta versión un rol desconocido lo rechaza
        Mongoose con 500. Usar un email nuevo para cada creación.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
            example:
              firstName: Ana
              lastName: Gomez
              email: ana@example.com
              password: clave-de-prueba
              role: customer
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                status: success
                message: Usuario creado
                payload:
                  _id: 6acf7ff968b188fed334690c
                  firstName: Ana
                  lastName: Gomez
                  email: ana@example.com
                  password: clave-de-prueba
                  role: customer
                  documents: []
        "400":
          description: Faltan datos obligatorios.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Faltan datos obligatorios
                code: VALIDATION_ERROR
        "500":
          description: >-
            Error interno. Actualmente los emails duplicados y algunas validaciones de Mongoose
            también responden 500.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
  /api/users/{uid}:
    parameters:
      - in: path
        name: uid
        required: true
        description: ID del usuario.
        schema:
          type: string
        example: 6acf7ff968b188fed334690c
    get:
      tags: [Users]
      summary: Obtener un usuario por ID
      responses:
        "200":
          description: Usuario obtenido por id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                status: success
                message: Usuario obtenido por id
                payload:
                  _id: 6acf7ff968b188fed334690c
                  firstName: Ana
                  lastName: Gomez
                  email: ana@example.com
                  password: clave-de-prueba
                  role: customer
                  documents: []
        "400":
          description: El ID no tiene el formato correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: ID invalido
                code: INVALID_ID_MONGOOSE
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Usuario no encontrado
                code: USER_NOT_FOUND
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
    put:
      tags: [Users]
      summary: Actualizar un usuario
      description: >-
        Enviar los campos que se quieren modificar. Un rol inválido se rechaza actualmente por
        Mongoose con 500.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateInput"
            example:
              firstName: Ana Maria
      responses:
        "200":
          description: Usuario actualizado por id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                status: success
                message: Usuario actualizado por id
                payload:
                  _id: 6acf7ff968b188fed334690c
                  firstName: Ana Maria
                  lastName: Gomez
                  email: ana@example.com
                  password: clave-de-prueba
                  role: customer
                  documents: []
        "400":
          description: El ID no tiene el formato correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: ID invalido
                code: INVALID_ID_MONGOOSE
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Usuario no encontrado
                code: USER_NOT_FOUND
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
    delete:
      tags: [Users]
      summary: Eliminar un usuario
      description: Devuelve el usuario eliminado. No elimina automáticamente sus pedidos o tiendas.
      responses:
        "200":
          description: Usuario eliminado por id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                status: success
                message: Usuario eliminado por id
                payload:
                  _id: 6acf7ff968b188fed334690c
                  firstName: Ana
                  lastName: Gomez
                  email: ana@example.com
                  password: clave-de-prueba
                  role: customer
                  documents: []
        "400":
          description: El ID no tiene el formato correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: ID invalido
                code: INVALID_ID_MONGOOSE
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Usuario no encontrado
                code: USER_NOT_FOUND
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
  /api/stores:
    get:
      tags: [Stores]
      summary: Listar tiendas
      responses:
        "200":
          description: Lista de tiendas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoresResponse"
              example:
                status: success
                payload:
                  - _id: 6acf7ff968b188fed334690b
                    name: Tienda Centro
                    address: Av. Siempre Viva 100
                    owner: 6acf7ff968b188fed334690a
                    isActive: true
        "500":
          description: >-
            Error al consultar la base. El mensaje depende de la causa; la respuesta no incluye
            code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreErrorResponse"
              example:
                status: error
                message: Error al consultar la base de datos
    post:
      tags: [Stores]
      summary: Crear una tienda
      description: >-
        owner debe identificar a un usuario con rol store. El controlador devuelve 500 incluso
        cuando faltan datos o no encuentra al propietario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreInput"
            example:
              name: Tienda Centro
              address: Av. Siempre Viva 100
              owner: 6acf7ff968b188fed334690a
      responses:
        "201":
          description: Tienda creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreResponse"
              example:
                status: success
                payload:
                  _id: 6acf7ff968b188fed334690b
                  name: Tienda Centro
                  address: Av. Siempre Viva 100
                  owner: 6acf7ff968b188fed334690a
                  isActive: true
        "500":
          description: >-
            El controlador actual devuelve 500 también ante datos inválidos, IDs mal formados y
            recursos inexistentes. Esta respuesta no incluye code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreErrorResponse"
              example:
                status: error
                message: Faltan datos obligatorios
  /api/stores/{sid}:
    parameters:
      - in: path
        name: sid
        required: true
        description: ID de la tienda; no confundir con el ID de su propietario.
        schema:
          type: string
        example: 6acf7ff968b188fed334690b
    get:
      tags: [Stores]
      summary: Obtener una tienda por ID
      responses:
        "200":
          description: Tienda obtenida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreResponse"
              example:
                status: success
                payload:
                  _id: 6acf7ff968b188fed334690b
                  name: Tienda Centro
                  address: Av. Siempre Viva 100
                  owner: 6acf7ff968b188fed334690a
                  isActive: true
        "500":
          description: >-
            El controlador actual devuelve 500 también ante datos inválidos, IDs mal formados y
            recursos inexistentes. Esta respuesta no incluye code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreErrorResponse"
              example:
                status: error
                message: Comercio no encontrado
    put:
      tags: [Stores]
      summary: Actualizar una tienda
      description: >-
        Enviar solo los campos que se quieren modificar. No vuelve a validar la existencia ni el rol
        de owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreUpdateInput"
            example:
              address: Av. Siempre Viva 200
      responses:
        "200":
          description: Tienda actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreResponse"
              example:
                status: success
                payload:
                  _id: 6acf7ff968b188fed334690b
                  name: Tienda Centro
                  address: Av. Siempre Viva 200
                  owner: 6acf7ff968b188fed334690a
                  isActive: true
        "500":
          description: >-
            El controlador actual devuelve 500 también ante datos inválidos, IDs mal formados y
            recursos inexistentes. Esta respuesta no incluye code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreErrorResponse"
              example:
                status: error
                message: Comercio no encontrado
    delete:
      tags: [Stores]
      summary: Eliminar una tienda
      description: Devuelve la tienda eliminada. No elimina automáticamente los pedidos asociados.
      responses:
        "200":
          description: Tienda eliminada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreResponse"
              example:
                status: success
                payload:
                  _id: 6acf7ff968b188fed334690b
                  name: Tienda Centro
                  address: Av. Siempre Viva 100
                  owner: 6acf7ff968b188fed334690a
                  isActive: true
        "500":
          description: >-
            El controlador actual devuelve 500 también ante datos inválidos, IDs mal formados y
            recursos inexistentes. Esta respuesta no incluye code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreErrorResponse"
              example:
                status: error
                message: Comercio no encontrado
  /api/mocks/mockingusers:
    get:
      tags: [Mocks]
      summary: Generar usuarios sin guardarlos
      description: Devuelve usuarios ficticios con nuevos IDs y emails. No los inserta en MongoDB.
      parameters:
        - in: query
          name: qty
          required: false
          description: Entero no negativo. Si no se envía, se generan 10. Esta versión no define un máximo.
          schema:
            type: integer
            minimum: 0
            default: 10
          example: 3
      responses:
        "200":
          description: Usuarios mock generados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockUsersResponse"
              example:
                status: success
                payload:
                  - _id: 6acf7ff968b188fed3346911
                    firstName: Usuario1
                    lastName: Demo1
                    email: user1@test.com
                    password: coder123
                    role: customer
                  - _id: 6acf7ff968b188fed3346912
                    firstName: Usuario2
                    lastName: Demo2
                    email: user2@test.com
                    password: coder123
                    role: customer
                  - _id: 6acf7ff968b188fed3346913
                    firstName: Usuario3
                    lastName: Demo3
                    email: user3@test.com
                    password: coder123
                    role: customer
        "400":
          description: Cantidad negativa, no entera o no numérica.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Cantidad de mocks invalida
                code: INVALID_MOCK_AMOUNT
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
  /api/mocks/mockingorders:
    get:
      tags: [Mocks]
      summary: Generar pedidos sin guardarlos
      description: >-
        Genera pedidos y relaciones ficticias en memoria. Los IDs relacionados no se guardan en
        MongoDB y no deben usarse como relaciones de un POST real.
      parameters:
        - in: query
          name: qty
          required: false
          description: Entero no negativo. Si no se envía, se generan 10. Esta versión no define un máximo.
          schema:
            type: integer
            minimum: 0
            default: 10
          example: 3
      responses:
        "200":
          description: Pedidos mock generados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockOrdersResponse"
              example:
                status: success
                payload:
                  - _id: 6acf7ff968b188fed3346921
                    customer: 6acf7ff968b188fed3346911
                    store: 6acf7ff968b188fed334690b
                    items:
                      - name: Paquete 1
                        quantity: 1
                        price: 1500
                    deliveryAddress: Av. Siempre Viva 101
                    total: 1500
                    status: created
                    priority: normal
                  - _id: 6acf7ff968b188fed3346922
                    customer: 6acf7ff968b188fed3346912
                    store: 6acf7ff968b188fed334690b
                    items:
                      - name: Paquete 2
                        quantity: 1
                        price: 1500
                    deliveryAddress: Av. Siempre Viva 102
                    total: 1500
                    status: created
                    priority: normal
                  - _id: 6acf7ff968b188fed3346923
                    customer: 6acf7ff968b188fed3346913
                    store: 6acf7ff968b188fed334690b
                    items:
                      - name: Paquete 3
                        quantity: 1
                        price: 1500
                    deliveryAddress: Av. Siempre Viva 103
                    total: 1500
                    status: created
                    priority: normal
        "400":
          description: Cantidad negativa, no entera o no numérica.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Cantidad de mocks invalida
                code: INVALID_MOCK_AMOUNT
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
  /api/mocks/generateData:
    post:
      tags: [Mocks]
      summary: Guardar datos ficticios en MongoDB
      description: >-
        Body opcional. Valores predeterminados: users=10, stores=5, orders=10. Las cantidades deben
        ser enteros no negativos, sin máximo definido. Para generar pedidos, users y stores deben
        ser mayores que cero en la misma carga. users cuenta clientes y propietarios. Los emails de
        mocks son fijos: repetir una carga puede causar duplicados.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockDataInput"
            example:
              users: 2
              stores: 1
              orders: 2
      responses:
        "201":
          description: Datos mock generados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockDataResponse"
              example:
                status: success
                payload:
                  users: 3
                  stores: 1
                  orders: 2
        "400":
          description: Cantidad inválida o se solicitan pedidos sin clientes o tiendas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Cantidad de mocks invalida
                code: INVALID_MOCK_AMOUNT
        "500":
          description: >-
            Error de persistencia. Al repetir la generación pueden producirse emails duplicados, que
            actualmente responden 500.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
  /health:
    get:
      tags: [Support]
      summary: Comprobar que la API responde
      description: Esta ruta no comprueba la conexión a MongoDB.
      responses:
        "200":
          description: API disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportResponse"
              example:
                status: success
                message: API funcionando
  /loggerTest:
    get:
      tags: [Support]
      summary: Emitir logs de prueba
      description: >-
        Emite mensajes en los niveles configurados del logger. Es una herramienta de soporte, no una
        operación de negocio.
      responses:
        "200":
          description: Respuesta de la ruta de logger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportResponse"
              example:
                status: success
                message: Logs generados correctamente
components:
  schemas:
    OrderItem:
      type: object
      required: [name, quantity, price]
      properties:
        name:
          type: string
          example: Caja mediana
        quantity:
          type: number
          description: Cantidad de unidades. El servicio actual no valida que sea positiva.
          example: 2
        price:
          type: number
          description: Precio por unidad. El servicio actual no valida que sea positivo.
          example: 1500
    User:
      type: object
      required: [_id, firstName, lastName, email, role]
      properties:
        _id:
          type: string
          example: 6acf7ff968b188fed334690c
        firstName:
          type: string
          example: Ana
        lastName:
          type: string
          example: Gomez
        email:
          type: string
          example: ana@example.com
        password:
          type: string
          example: clave-de-prueba
        role:
          type: string
          enum: [admin, customer, store]
          example: customer
        documents:
          type: array
          items: {}
          example: []
    UserInput:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
          example: Ana
        lastName:
          type: string
          example: Gomez
        email:
          type: string
          example: ana@example.com
        password:
          type: string
          example: clave-de-prueba
        role:
          type: string
          enum: [admin, customer, store]
          default: customer
          example: customer
    Store:
      type: object
      required: [_id, name, address, owner]
      properties:
        _id:
          type: string
          example: 6acf7ff968b188fed334690b
        name:
          type: string
          example: Tienda Centro
        address:
          type: string
          example: Av. Siempre Viva 100
        owner:
          type: string
          description: ID del usuario propietario; no es el ID de la tienda.
          example: 6acf7ff968b188fed334690a
        isActive:
          type: boolean
          example: true
    StoreInput:
      type: object
      required: [name, address, owner]
      properties:
        name:
          type: string
          example: Tienda Centro
        address:
          type: string
          example: Av. Siempre Viva 100
        owner:
          type: string
          description: ID de un usuario existente con rol store.
          example: 6acf7ff968b188fed334690a
    OrderInput:
      type: object
      required: [customer, store, items, deliveryAddress]
      properties:
        customer:
          type: string
          description: >-
            ID de un usuario existente. Se utiliza como cliente, aunque esta versión no comprueba su
            rol.
          example: 6acf7ff968b188fed334690c
        store:
          type: string
          description: ID de una tienda existente. Reemplazar por un ID de tu base.
          example: 6acf7ff968b188fed334690b
        deliveryAddress:
          type: string
          example: Calle falsa 123
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
          minItems: 1
        priority:
          type: string
          enum: [low, normal, high]
          default: normal
          example: normal
    OrderStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [created, assigned, picked_up, in_transit, delivered, cancelled]
          example: assigned
    MockDataInput:
      type: object
      properties:
        users:
          type: integer
          minimum: 0
          default: 10
          example: 2
          description: Cantidad de clientes.
        stores:
          type: integer
          minimum: 0
          default: 5
          example: 1
          description: Cantidad de tiendas. Se crea un propietario por tienda.
        orders:
          type: integer
          minimum: 0
          default: 10
          example: 2
          description: Para crear pedidos, users y stores deben ser mayores que cero.
    MockDataResult:
      type: object
      required: [users, stores, orders]
      properties:
        users:
          type: integer
          example: 3
          description: Total de clientes y propietarios creados.
        stores:
          type: integer
          example: 1
        orders:
          type: integer
          example: 2
    ErrorResponse:
      type: object
      required: [status, message, code]
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Pedido no encontrado
        code:
          type: string
          example: ORDER_NOT_FOUND
    InternalErrorResponse:
      type: object
      required: [status, message, code]
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Error interno en el servidor
        code:
          description: Puede ser un texto o un código numérico de MongoDB, según el error original.
          example: INTERNAL_SERVER_ERROR
    UserUpdateInput:
      type: object
      properties:
        firstName:
          type: string
          example: Ana
        lastName:
          type: string
          example: Gomez
        email:
          type: string
          example: ana@example.com
        password:
          type: string
          example: clave-de-prueba
        role:
          type: string
          enum: [admin, customer, store]
          example: customer
      description: Enviar solo los campos que se quieren actualizar. No se exigen todos los campos de creación.
    StoreUpdateInput:
      type: object
      properties:
        name:
          type: string
          example: Tienda Centro
        address:
          type: string
          example: Av. Siempre Viva 100
        owner:
          type: string
          description: ID de un usuario existente con rol store.
          example: 6acf7ff968b188fed334690a
        isActive:
          type: boolean
          example: true
      description: >-
        Enviar solo los campos a actualizar. La actualización actual no vuelve a comprobar el rol
        del propietario.
    Customer:
      type: object
      required: [_id, firstName, lastName, email, role]
      properties:
        _id:
          type: string
          example: 6acf7ff968b188fed334690c
        firstName:
          type: string
          example: Ana
        lastName:
          type: string
          example: Gomez
        email:
          type: string
          example: ana@example.com
        password:
          type: string
          example: clave-de-prueba
        role:
          type: string
          enum: [admin, customer, store]
          example: customer
        documents:
          type: array
          items: {}
          example: []
      nullable: true
      description: Usuario poblado por las consultas de pedidos. Puede ser null si el usuario fue eliminado.
    StoreRead:
      type: object
      required: [_id, name, address, owner]
      properties:
        _id:
          type: string
          example: 6acf7ff968b188fed334690b
        name:
          type: string
          example: Tienda Centro
        address:
          type: string
          example: Av. Siempre Viva 100
        owner:
          type: string
          description: ID del usuario propietario; no es el ID de la tienda.
          example: 6acf7ff968b188fed334690a
        isActive:
          type: boolean
          example: true
      nullable: true
      description: Tienda poblada por las consultas de pedidos. Puede ser null si la tienda fue eliminada.
    Order:
      type: object
      required: [_id, customer, store, items, deliveryAddress, total, status, priority]
      properties:
        _id:
          type: string
          example: 6acf7ff968b188fed334690d
        customer:
          type: string
          example: 6acf7ff968b188fed334690c
        store:
          type: string
          example: 6acf7ff968b188fed334690b
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        deliveryAddress:
          type: string
          example: Calle falsa 123
        total:
          type: number
          description: Calculado por el servidor.
          example: 3000
        status:
          type: string
          enum: [created, assigned, picked_up, in_transit, delivered, cancelled]
          example: created
        priority:
          type: string
          enum: [low, normal, high]
          example: normal
    OrderRead:
      type: object
      required: [_id, customer, store, items, deliveryAddress, total, status, priority]
      properties:
        _id:
          type: string
          example: 6acf7ff968b188fed334690d
        customer:
          $ref: "#/components/schemas/Customer"
        store:
          $ref: "#/components/schemas/StoreRead"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        deliveryAddress:
          type: string
          example: Calle falsa 123
        total:
          type: number
          description: Calculado por el servidor.
          example: 3000
        status:
          type: string
          enum: [created, assigned, picked_up, in_transit, delivered, cancelled]
          example: created
        priority:
          type: string
          enum: [low, normal, high]
          example: normal
      description: Pedido consultado con cliente y tienda pobladas.
    OrdersResponse:
      type: object
      required: [status, message, payload]
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Lista de ordenes
        payload:
          type: array
          items:
            $ref: "#/components/schemas/OrderRead"
    OrderResponse:
      type: object
      required: [status, message, payload]
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Orden actualizada
        payload:
          $ref: "#/components/schemas/Order"
    OrderReadResponse:
      type: object
      required: [status, message, payload]
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Orden obtenida
        payload:
          $ref: "#/components/schemas/OrderRead"
    UsersResponse:
      type: object
      required: [status, message, payload]
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Lista de usuarios
        payload:
          type: array
          items:
            $ref: "#/components/schemas/User"
    UserResponse:
      type: object
      required: [status, message, payload]
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Usuario eliminado por id
        payload:
          $ref: "#/components/schemas/User"
    StoresResponse:
      type: object
      required: [status, payload]
      properties:
        status:
          type: string
          example: success
        payload:
          type: array
          items:
            $ref: "#/components/schemas/Store"
    StoreResponse:
      type: object
      required: [status, payload]
      properties:
        status:
          type: string
          example: success
        payload:
          $ref: "#/components/schemas/Store"
    MockUsersResponse:
      type: object
      required: [status, payload]
      properties:
        status:
          type: string
          example: success
        payload:
          type: array
          items:
            $ref: "#/components/schemas/User"
    MockOrdersResponse:
      type: object
      required: [status, payload]
      properties:
        status:
          type: string
          example: success
        payload:
          type: array
          items:
            $ref: "#/components/schemas/Order"
    MockDataResponse:
      type: object
      required: [status, payload]
      properties:
        status:
          type: string
          example: success
        payload:
          $ref: "#/components/schemas/MockDataResult"
    StoreErrorResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Comercio no encontrado
    SupportResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: API funcionando
